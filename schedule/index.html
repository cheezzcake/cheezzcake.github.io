<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="苏以轩的四周日程安排。" />
    <title>日程安排 | Yixuan Su</title>
    <link rel="stylesheet" href="../styles.css?v=20260604-8" />
    <script src="./schedule.js?v=20260604-3" defer></script>
  </head>
  <body>
    <main class="page-shell schedule-shell">
      <header class="site-header" aria-label="站点导航">
        <a class="brand" href="../" aria-label="返回首页">
          <img class="brand-avatar" src="../Profile.jpg" alt="苏以轩头像" />
          <span>Yixuan Su</span>
        </a>
        <nav class="top-nav" aria-label="主导航">
          <a href="../profile/">Profile</a>
          <a href="./">Schedule</a>
          <a href="../research/">Research</a>
          <a href="../notes/">Notes</a>
          <a href="https://space.bilibili.com/1643157133" target="_blank" rel="noreferrer">Bilibili</a>
          <a href="https://github.com/Cheezzcake" target="_blank" rel="noreferrer">GitHub</a>
        </nav>
      </header>

      <section class="section-hero schedule-hero" aria-labelledby="schedule-title">
        <p class="eyebrow">Schedule</p>
        <h1 id="schedule-title">日程安排</h1>
      </section>

      <section class="schedule-toolbar" aria-label="日程工具栏">
        <button class="add-task" type="button">新增到今天</button>
        <button class="upload-json" type="button">上传 JSON</button>
        <label class="type-picker">
          <span>新增类型</span>
          <select id="task-type">
            <option value="math">数学</option>
            <option value="physics">物理</option>
            <option value="general">综合</option>
            <option value="life">生活</option>
            <option value="exam">考试</option>
          </select>
        </label>
        <label class="type-picker">
          <span>显示</span>
          <select id="task-filter">
            <option value="all">全部</option>
            <option value="math">数学</option>
            <option value="physics">物理</option>
            <option value="general">综合</option>
            <option value="life">生活</option>
            <option value="exam">考试</option>
          </select>
        </label>
        <div class="trash-zone" role="button" tabindex="0" aria-label="回收站">回收站</div>
        <p class="sync-status" role="status" aria-live="polite"></p>
      </section>

      <section id="schedule-board" class="schedule-board" aria-label="最近四周日程表"></section>
    </main>
  </body>
</html>
