<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Yixuan Su 的个人主页：个人简介、日程安排、笔记与科研工作。"
    />
    <title>Yixuan Su</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header" aria-label="站点导航">
        <a class="brand" href="./" aria-label="返回首页">
          <img src="./Profile.jpg" alt="Yixuan Su 头像" />
          <span>Yixuan Su</span>
        </a>
        <nav class="top-nav" aria-label="主导航">
          <a href="./research/">Research</a>
          <a href="./notes/">Notes</a>
        </nav>
      </header>

      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">Personal Page</p>
          <h1 id="hero-title">Yixuan Su</h1>
          <p class="intro">
            记录研究、写作、日程与长期思考的个人空间。
          </p>
        </div>

        <div class="visual-stack" aria-label="个人主页视觉预览">
          <div class="desktop-shot">
            <img src="./Desktop.jpg" alt="桌面端主页预览" />
          </div>
          <div class="phone-shot">
            <img src="./iPhone.jpg" alt="移动端主页预览" />
          </div>
        </div>
      </section>

      <section class="entry-grid" aria-label="主页入口">
        <a class="entry-card" href="./profile/">
          <span class="entry-index">01</span>
          <span class="entry-title">个人简介</span>
          <span class="entry-text">关于我、联系方式与学术背景。</span>
        </a>

        <a class="entry-card" href="./schedule/">
          <span class="entry-index">02</span>
          <span class="entry-title">日程安排</span>
          <span class="entry-text">近期计划、会议、DDL 与时间线。</span>
        </a>

        <a class="entry-card" href="./notes/">
          <span class="entry-index">03</span>
          <span class="entry-title">笔记</span>
          <span class="entry-text">阅读记录、问题清单与学习整理。</span>
        </a>

        <a class="entry-card" href="./research/">
          <span class="entry-index">04</span>
          <span class="entry-title">科研工作</span>
          <span class="entry-text">项目、论文、代码与研究方向。</span>
        </a>
      </section>
    </main>
  </body>
</html>
